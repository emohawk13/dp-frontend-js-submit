<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    <link rel="stylesheet" href="styles/common-styles.css">
</head>

<body>
    <h1>Rock - Paper - Scissors</h1>
    <div id="choices" class="choices">
        <button onclick="rpsPlay('Rock')"><img src="/assets/rock.jpg" alt="rock" height="100px" width="100px"></button>
        <button onclick="rpsPlay('Paper')"><img src="/assets/paper.png" alt="paper" height="100px"
                width="100px"></button>
        <button onclick="rpsPlay('Scissors')"><img src="/assets/scissors.png" alt="scissors" height="100px"
                width="100px"></button>
    </div>

    <div class="displays">
        <div id="playerDisplay"></div>
        <div id="computerDisplay"></div>
        <div id="resultsDisplay"></div>
    </div>

    <div class="score-display">Player Score:<span id="playerScoreDisplay"> 0</span></div>
    <div class="score-display">Computer Score:<span id="computerScoreDisplay"> 0</span></div>
    <div class="score-display">Tie Total:<span id="tieScoreDisplay"> 0</span></div>
    <div class="score-display">Total Games Played:<span id="totalScoreDisplay"> 0</span></div>

    <script src="scripts/common-scripts.js"></script>
</body>

</html>
